<style>

body {

}

.card {

.picture {

.question {
  font-size: 20px;

  margin: 24px 0 15px;

.answers {
  display: grid;

  gap: 10px;
}

.answer-btn {
  background: #f8fcf9;

  font-family: inherit;
  font-size: 18px;
  cursor: pointer;
  min-height: 54px;
}

.answer-btn:hover:not(:disabled) {
  background: #eaf8ef;
  border-color: #16845d;
}

.answer-btn:disabled {
  cursor: default;
}

.answer-btn.correct {
  background: #dcf8e5;
  border-color: #239b58;
  color: #126735;
  font-weight: bold;
}

.answer-btn.wrong {
  background: #fff0f0;
  border-color: #dc6262;
  color: #a52a2a;
}

.feedback {
  min-height: 36px;
  margin: 17px 0 5px;
  font-size: 22px;
  font-weight: bold;
  direction: ltr;
}

.next-btn, .restart-btn {
  background: #16845d;
  color: white;
  border: none;
  border-radius: 14px;
  padding: 14px 24px;
  font-family: inherit;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 12px;
}

.next-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.hidden {
  display: none !important;
}

.footer {
  text-align: center;
  color: #75847b;
  font-size: 13px;
  margin: 20px 0;
}

@media (min-width: 550px) {
  .answers {
    grid-template-columns: 1fr 1fr;
  }

  .answer-btn:last-child:nth-child(odd) {
    grid-column: 1 / -1;
  }
}
</style>
</head>

<body>

<div class="container">

  </header>

  <div class="stats">

      السؤال

    <div class="category" id="category">كلمات يومية</div>

    </div>

      السؤال التالي ←

  </section>

  <section class="card hidden" id="resultCard">
    <div style="font-size:65px">🏆🌟</div>
    <h2>أحسنت يا بطل!</h2>

    <p id="finalMessage"></p>

  </section>

  <div class="footer">
    إعداد وبرمجة: وائل دهشان
  </div>

</div>

<script>
const words = [
["Apple","تفاحة","🍎","طعام"],
["Book","كتاب","📘","أشياء"],
["Cat","قطة","🐱","حيوانات"],
["Dog","كلب","🐶","حيوانات"],

["Moon","قمر","🌙","الطبيعة"],
["Star","نجمة","⭐","الطبيعة"],
["Tree","شجرة","🌳","الطبيعة"],
["Flower","زهرة","🌸","الطبيعة"],
["Bird","طائر","🐦","حيوانات"],

["Lion","أسد","🦁","حيوانات"],
["Elephant","فيل","🐘","حيوانات"],
["Rabbit","أرنب","🐰","حيوانات"],

["Write","يكتب","✍️","أفعال"],

["Train","قطار","🚆","المواصلات"],
["Airplane","طائرة","✈️","المواصلات"],
["Ball","كرة","⚽","الألعاب"],
["Doll","دمية","🪆","الألعاب"],
["Chair","كرسي","🪑","أشياء"],
["Table","طاولة","🪵","أشياء"],
["Door","باب","🚪","أشياء"],
["Window","نافذة","🪟","أشياء"],
["Morning","صباح","🌅","الوقت"],
["Night","ليل","🌃","الوقت"],
["Today","اليوم","📅","الوقت"],
["Tomorrow","غدًا","➡️","الوقت"],
["Rain","مطر","🌧️","الطقس"],
["Snow","ثلج","❄️","الطقس"],
["Playground","ملعب","🛝","أماكن"],
["Garden","حديقة","🌻","أماكن"],
["Help","يساعد","🫶","أفعال"],
["Thank you","شكرًا لك","🙏","عبارات"]
];

let order = [];
let current = 0;
let score = 0;
let answered = false;

const el = id => document.getElementById(id);

function shuffle(array) {
  const result = [...array];

  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }

  return result;
}

function speak(text) {
  if (!("speechSynthesis" in window)) {
    return;
  }

  window.speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "en-US";
  utterance.rate = 0.85;
  utterance.pitch = 1.05;

  window.speechSynthesis.speak(utterance);
}

function renderQuestion() {
  answered = false;

  const item = words[order[current]];

  el("questionCount").textContent =
    (current + 1) + " / " + words.length;

  el("score").textContent = score;
  el("stage").textContent = Math.floor(current / 20) + 1;

  el("progressBar").style.width =
    (current / words.length * 100) + "%";

  el("word").textContent = item[0];
  el("picture").textContent = item[2];
  el("category").textContent = item[3];

  el("feedback").textContent = "";
  el("nextBtn").disabled = true;

  el("nextBtn").textContent =
    current === words.length - 1
      ? "عرض النتيجة 🏆"
      : "السؤال التالي ←";

  // اختيار إجابتين خاطئتين، بالإضافة إلى الإجابة الصحيحة
  const wrong = shuffle(
    words
      .map((word, index) => index)
      .filter(index => index !== order[current])
  ).slice(0, 2);

  const options = shuffle([order[current], ...wrong]);

  el("answers").innerHTML = "";

  options.forEach(index => {
    const button = document.createElement("button");

    button.type = "button";
    button.className = "answer-btn";
    button.textContent = words[index][1];

    button.addEventListener("click", () => {
      checkAnswer(button, index);
    });

    el("answers").appendChild(button);
  });

  // نطق الكلمة عند بدء السؤال
  setTimeout(() => speak(item[0]), 350);
}

function checkAnswer(button, selectedIndex) {
  if (answered) return;

  const correctIndex = order[current];

  if (selectedIndex === correctIndex) {
    answered = true;
    score++;

    document.querySelectorAll(".answer-btn").forEach(btn => {
      btn.disabled = true;

      if (btn.textContent === words[correctIndex][1]) {
        btn.classList.add("correct");
      }
    });

    el("feedback").textContent = "Very Good!";
    el("feedback").style.color = "#16845d";

    el("score").textContent = score;
    el("nextBtn").disabled = false;

    // التشجيع عند الإجابة الصحيحة
    speak("Very Good!");

  } else {
    button.classList.add("wrong");
    button.disabled = true;

    el("feedback").textContent = "No problem, try again!";
    el("feedback").style.color = "#bd3737";

    // التشجيع عند الخطأ، مع بقاء السؤال نفسه
    speak("No problem, try again!");
  }
}

function finishQuiz() {
  el("quizCard").classList.add("hidden");
  el("resultCard").classList.remove("hidden");

  el("progressBar").style.width = "100%";
  el("questionCount").textContent = "100 / 100";

  el("finalScore").textContent =
    "نتيجتك: " + score + " من " + words.length;

  if (score >= 90) {
    el("finalMessage").textContent =
      "ممتاز جدًا! أنت نجم اللغة الإنجليزية! 🌟";
  } else if (score >= 70) {
    el("finalMessage").textContent =
      "عمل رائع! استمر في التعلّم! 👏";
  } else {
    el("finalMessage").textContent =
      "أحسنت على المحاولة! العب مرة أخرى لتتعلم أكثر! 💪";
  }

  speak("Congratulations! You did a great job!");
}

function startQuiz() {
  order = shuffle(words.map((_, index) => index));

  current = 0;
  score = 0;
  answered = false;

  el("quizCard").classList.remove("hidden");
  el("resultCard").classList.add("hidden");

  renderQuestion();
}

el("listenBtn").addEventListener("click", () => {
  speak(words[order[current]][0]);
});

el("nextBtn").addEventListener("click", () => {
  if (!answered) return;

  if (current < words.length - 1) {
    current++;
    renderQuestion();
  } else {
    finishQuiz();
  }
});

el("restartBtn").addEventListener("click", startQuiz);

startQuiz();
</script>
